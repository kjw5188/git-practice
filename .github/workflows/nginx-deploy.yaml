name: Nginx 메인 설정 파일(nginx.conf) 자동 검사 및 배포

on:
  push:
    branches: [ "main" ]
    # nginx/nginx.conf 파일이 수정되었을 때만 이 Workflow 실행!
    paths:
      - 'nginx/nginx.conf'

jobs:
  deploy-nginx-conf:
    runs-on: self-hosted

    steps:
      - name: 1. 최신 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 2. nginx.conf 파일을 서버의 /etc/nginx/ 경로로 덮어쓰기
        run: |
          echo "=== Nginx 설정 파일(/etc/nginx/nginx.conf) 복사 시작 ==="
          sudo cp ./nginx/nginx.conf /etc/nginx/nginx.conf

      - name: 3. Nginx 문법 검사 (Syntax Test)
        run: |
          echo "=== Nginx 문법 검사 실행 (nginx -t) ==="
          # 오타나 문법 에러가 있으면 여기서 작업이 즉시 중단되어 아래 reload가 실행되지 않습니다.
          sudo nginx -t

      - name: 4. Nginx 서비스 무중단 재로드 (Reload)
        run: |
          echo "=== Nginx Reload 실행 ==="
          sudo systemctl reload nginx
          echo "Nginx 새로운 설정 파일이 정상적으로 적용되었습니다!"