name: Full Stack CI/CD (Lint + Docker Volume Binding + NCP Deploy + Slack)

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # [1단계: CI] 소스코드 Lint 검사 (공식 Node Docker 활용)
  # ==========================================
  ci-test:
    name: 🔍 [CI] 소스코드 Lint 및 문법 검사
    runs-on: self-hosted

    steps:
      - name: 코드 Checkout
        uses: actions/checkout@v4

      - name: HTML Lint 검사 수행
        run: |
          echo "=== HTML 문법 및 린트 검사 시작 ==="
          # Docker 공식 node:20-alpine 컨테이너 내부에서 npx로 htmlhint 실행
          docker run --rm -v $(pwd):/app -w /app node:20-alpine npx htmlhint "src/*.html"

  # ==========================================
  # [2단계: CD] Nginx 컨테이너 구동 & Volume Binding 배포 & 헬스체크
  # ==========================================
  cd-deploy:
    name: 🚀 [CD] Nginx Volume Binding 배포 및 NCP 반영
    needs: ci-test # CI 검사가 성공해야만 실행
    runs-on: self-hosted

    steps:
      - name: 코드 Checkout
        uses: actions/checkout@v4

      - name: 1. 기존 컨테이너 정지 및 Volume Binding 구동
        run: |
          echo "=== 기존 컨테이너 정리 및 신규 바인딩 구동 ==="
          if [ $(docker ps -aq -f name=web-app) ]; then
              echo "기존 web-app 컨테이너 중지 및 제거..."
              docker stop web-app || true
              docker rm web-app || true
          fi

          # 호스트의 $(pwd)/src 디렉터리를 Nginx html 루트 경로에 Volume Binding
          docker run -d \
            --name web-app \
            -p 80:80 \
            -v $(pwd)/src:/usr/share/nginx/html \
            nginx:latest

      - name: 2. 서비스 헬스체크 (Health Check)
        run: |
          echo "=== 서비스 헬스체크 진행 ==="
          sleep 3
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:80)
          echo "HTTP 응답 코드: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "❌ 헬스체크 실패! HTTP 상태 코드가 200이 아닙니다."
              exit 1
          fi
          echo "✅ 헬스체크 성공! 서비스 정상 작동 중"

  # ==========================================
  # [3단계: Notification] Slack 알림 전송
  # ==========================================
  slack-notification:
    name: 🔔 Slack 알림 전송
    needs: [ci-test, cd-deploy]
    if: always() # 성공/실패 여부와 관계없이 무조건 실행
    runs-on: self-hosted

    steps:
      - name: Slack 성공 알림
        if: ${{ needs.ci-test.result == 'success' && needs.cd-deploy.result == 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "🟢 [NCP Rocky Linux 8.10] 배포 성공!"
          SLACK_MESSAGE: "Nginx 컨테이너(web-app)가 Volume Binding 방식으로 성공적으로 배포되었습니다."
          SLACK_COLOR: "good"

      - name: Slack 실패 알림
        if: ${{ needs.ci-test.result == 'failure' || needs.cd-deploy.result == 'failure' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "🔴 [NCP Rocky Linux 8.10] 배포 실패!"
          SLACK_MESSAGE: "Lint 검사 또는 Nginx 배포/헬스체크 과정에서 에러가 발생했습니다."
          SLACK_COLOR: "danger"