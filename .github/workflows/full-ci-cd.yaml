name: Full Stack CI/CD (Lint + Guard Check + Nginx Conf & Src Mount + NCP Deploy + Slack)

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # [1단계: CI] 소스코드 & Nginx 설정 문법 검사
  # ==========================================
  ci-test:
    name: 🔍 [CI] 소스코드 & Nginx 설정 문법 검사
    runs-on: self-hosted

    steps:
      - name: 코드 Checkout
        uses: actions/checkout@v4

      - name: HTML Lint 검사 (Docker node:20-alpine 활용)
        run: |
          echo "=== HTML 문법 검사 시작 ==="
          docker run --rm -v ${{ github.workspace }}:/app -w /app node:20-alpine npx htmlhint "nginx/src/*.html"

      - name: Nginx 설정 파일 문법 검사 (nginx.conf 대상)
        run: |
          echo "=== Nginx 설정 파일(nginx.conf) Syntax Check ==="
          docker run --rm \
            -v ${{ github.workspace }}/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro \
            nginx:latest nginx -t

  # ==========================================
  # [2단계: CD] Nginx 무중단 배포 (Volume Binding 방식)
  # ==========================================
  cd-deploy:
    name: 🚀 [CD] Nginx 무중단 배포 및 NCP 반영
    needs: ci-test
    runs-on: self-hosted

    steps:
      - name: 코드 Checkout
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # 🛡️ [안전장치] 필수 배포 파일 및 디렉터리 사전 검증 (Guard Check)
      # ----------------------------------------------------
      - name: 0. 배포 대상 파일 및 디렉터리 사전 검증
        run: |
          echo "=== 🔍 배포 파일 및 경로 사전 검증 시작 ==="
          
          CONF_PATH="${{ github.workspace }}/nginx/conf/nginx.conf"
          SRC_PATH="${{ github.workspace }}/nginx/src/index.html"

          # 1. nginx.conf 파일 존재 확인
          if [ ! -f "$CONF_PATH" ]; then
              echo "❌ [ERROR] Nginx 설정 파일이 존재하지 않습니다: $CONF_PATH"
              exit 1
          fi

          # 2. index.html 파일 존재 확인
          if [ ! -f "$SRC_PATH" ]; then
              echo "❌ [ERROR] 웹 소스 파일(index.html)이 존재하지 않습니다: $SRC_PATH"
              exit 1
          fi

          # 3. src 디렉터리가 비어있는지 확인
          if [ -z "$(ls -A ${{ github.workspace }}/nginx/src)" ]; then
              echo "❌ [ERROR] nginx/src 디렉터리가 비어 있습니다!"
              exit 1
          fi

          echo "✅ 모든 필수 파일 및 디렉터리 검증 완료!"

      # ----------------------------------------------------
      # 🚀 [배포] Nginx 컨테이너 무중단 반영
      # ----------------------------------------------------
      - name: 1. Nginx 컨테이너 상태 점검 및 무중단 Reload 배포
        run: |
          echo "=== Nginx 컨테이너 점검 및 배포 시작 ==="

          if [ $(docker ps -q -f name=web-app) ]; then
              echo "✅ Nginx 컨테이너가 이미 구동 중입니다."
              echo "🔄 Volume Binding에 의해 최신 소스 및 설정이 즉시 공유되었습니다."
              echo "⚡ nginx -s reload를 호출하여 다운타임 없이 반영합니다."
              docker exec web-app nginx -s reload
          else
              echo "🚀 컨테이너가 없거나 정지 상태입니다. 신규 생성 및 볼륨 바인딩을 진행합니다..."
              docker rm -f web-app || true

              # nginx/src ➔ /usr/share/nginx/html
              # nginx/conf/nginx.conf ➔ /etc/nginx/nginx.conf
              docker run -d \
                --name web-app \
                -p 80:80 \
                -v ${{ github.workspace }}/nginx/src:/usr/share/nginx/html:z \
                -v ${{ github.workspace }}/nginx/conf/nginx.conf:/etc/nginx/nginx.conf:z \
                nginx:latest
          fi

      - name: 2. 서비스 헬스체크 (Health Check)
        run: |
          echo "=== 서비스 헬스체크 진행 ==="
          sleep 1
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:80)
          echo "HTTP 응답 코드: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "❌ 헬스체크 실패! HTTP 상태 코드가 200이 아닙니다."
              exit 1
          fi
          echo "✅ 헬스체크 성공! 서비스 정상 작동 중"

  # ==========================================
  # [3단계: Notification] Slack 알림 전송
  # ==========================================
  slack-notification:
    name: 🔔 Slack 알림 전송
    needs: [ci-test, cd-deploy]
    if: always()
    runs-on: self-hosted

    steps:
      - name: Slack 성공 알림
        if: ${{ needs.ci-test.result == 'success' && needs.cd-deploy.result == 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "🟢 [NCP Rocky Linux 8.10] Nginx 배포 성공!"
          SLACK_MESSAGE: "nginx/conf/nginx.conf 및 nginx/src 소스가 무중단(Zero-Downtime)으로 정상 반영되었습니다."
          SLACK_COLOR: "good"

      - name: Slack 실패 알림
        if: ${{ needs.ci-test.result == 'failure' || needs.cd-deploy.result == 'failure' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "🔴 [NCP Rocky Linux 8.10] 배포 실패!"
          SLACK_MESSAGE: "CI 문법 검사, 경로 사전 검증, 헬스체크 또는 배포 과정에서 에러가 발생했습니다."
          SLACK_COLOR: "danger"