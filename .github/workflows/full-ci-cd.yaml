name: Full Stack CI/CD (Lint + Docker + NCP Deploy + Slack)

on:
  push:
    branches: [ "main" ]

jobs:
  # ==========================================
  # [1단계: CI] 소스코드 Lint 검사 (Docker 활용)
  # ==========================================
  ci-test:
    name: 🔍 [CI] 소스코드 Lint 및 문법 검사
    runs-on: self-hosted

    steps:
      - name: 코드 Checkout
        uses: actions/checkout@v4

      - name: HTML Lint 검사 수행
        run: |
          echo "=== HTML 문법 및 린트 검사 시작 ==="
          # 서버에 Node.js 설치 없이 Docker로 HTMLHint 구동
          docker run --rm -v $(pwd):/html htmlhint/htmlhint "src/*.html"

  # ==========================================
  # [2단계: CD] Docker 빌드, 배포, 헬스체크
  # ==========================================
  cd-deploy:
    name: 🚀 [CD] Docker 빌드 및 NCP 배포
    needs: ci-test # CI 검사가 성공해야만 실행
    runs-on: self-hosted

    steps:
      - name: 코드 Checkout
        uses: actions/checkout@v4

      - name: 1. Docker 이미지 빌드
        run: |
          echo "=== Docker 이미지 빌드 시작 ==="
          docker build -t git-practice-app:latest .

      - name: 2. 기존 컨테이너 정지 및 신규 컨테이너 구동
        run: |
          echo "=== 기존 컨테이너 정리 및 재구동 ==="
          if [ $(docker ps -aq -f name=web-app) ]; then
              echo "기존 web-app 컨테이너 중지 및 제거..."
              docker stop web-app || true
              docker rm web-app || true
          fi
          docker run -d --name web-app -p 80:80 git-practice-app:latest

      - name: 3. 서비스 헬스체크 (Health Check)
        run: |
          echo "=== 서비스 헬스체크 진행 ==="
          sleep 3
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost:80)
          echo "HTTP 응답 코드: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ]; then
              echo "❌ 헬스체크 실패! HTTP 상태 코드가 200이 아닙니다."
              exit 1
          fi
          echo "✅ 헬스체크 성공! 서비스 정상 작동 중"

  # ==========================================
  # [3단계: Notification] Slack 알림 전송
  # ==========================================
  slack-notification:
    name: 🔔 Slack 알림 전송
    needs: [ci-test, cd-deploy]
    if: always() # 성공/실패 여부와 관계없이 무조건 실행
    runs-on: self-hosted

    steps:
      - name: Slack 성공 알림
        if: ${{ needs.ci-test.result == 'success' && needs.cd-deploy.result == 'success' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "🟢 [NCP Rocky Linux 8.10] 배포 성공!"
          SLACK_MESSAGE: "Docker 컨테이너(web-app)가 성공적으로 빌드 및 배포되었습니다."
          SLACK_COLOR: "good"

      - name: Slack 실패 알림
        if: ${{ needs.ci-test.result == 'failure' || needs.cd-deploy.result == 'failure' }}
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_TITLE: "🔴 [NCP Rocky Linux 8.10] 배포 실패!"
          SLACK_MESSAGE: "Lint 검사 또는 Docker 배포/헬스체크 과정에서 에러가 발생했습니다."
          SLACK_COLOR: "danger"